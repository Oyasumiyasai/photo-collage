<!DOCTYPE html>
<html lang="ja" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Collage App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                        title: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(71, 85, 105, 1);
        }

        /* Viewport Containment for Canvas */
        #collage-viewport {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            padding: 0.75rem;
            box-sizing: border-box;
        }

        #collage-canvas {
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transition: aspect-ratio 0.25s ease, width 0.25s ease, height 0.25s ease;
            box-sizing: border-box;
            user-select: none;
            touch-action: none;
            max-width: 100%;
            max-height: 100%;
        }

        #collage-grid {
            position: absolute;
            display: grid;
            box-sizing: border-box;
            width: 100%;
            height: 100%;
        }

        .collage-slot {
            position: relative;
            overflow: hidden;
            background-color: #1e293b;
            cursor: grab;
            user-select: none;
            touch-action: none;
            transition: box-shadow 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        }

        .collage-slot:active {
            cursor: grabbing;
        }

        .collage-slot.dragging-active {
            z-index: 40 !important;
            box-shadow: 0 0 0 3px #3b82f6, 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            opacity: 0.9;
            transform: scale(1.03);
        }

        .collage-slot img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
            transform-origin: center center;
            will-change: transform;
        }

        /* Custom Filter Presets CSS */
        .filter-mono { filter: grayscale(100%); }
        .filter-sepia { filter: sepia(90%) contrast(110%); }
        .filter-vintage { filter: sepia(40%) contrast(120%) brightness(90%) saturate(85%); }
        .filter-cyberpunk { filter: hue-rotate(280deg) saturate(200%) contrast(120%); }
        .filter-emerald { filter: hue-rotate(110deg) saturate(140%) contrast(110%); }
        .filter-duotone { filter: grayscale(100%) contrast(150%) sepia(50%) hue-rotate(180deg); }
        .filter-warm { filter: sepia(30%) saturate(140%) brightness(105%); }
        .filter-cool { filter: hue-rotate(180deg) saturate(120%) brightness(105%); }
        .filter-contrast { filter: contrast(160%) saturate(120%); }
        .filter-dramatic { filter: contrast(180%) brightness(85%) saturate(110%); }
        .filter-film { filter: sepia(20%) contrast(115%) brightness(95%) saturate(90%); }
        .filter-pastel { filter: brightness(115%) saturate(70%) contrast(90%); }
        .filter-vivid { filter: saturate(220%) contrast(115%); }
        .filter-noir { filter: grayscale(100%) contrast(200%) brightness(80%); }
        .filter-fade { filter: opacity(85%) contrast(85%) brightness(110%); }
        .filter-sunset { filter: sepia(50%) hue-rotate(320deg) saturate(180%); }
        .filter-cyber { filter: hue-rotate(160deg) saturate(190%) contrast(130%); }
        .filter-rose { filter: hue-rotate(300deg) saturate(130%) brightness(105%); }
        .filter-soft { filter: brightness(108%) contrast(92%) saturate(95%); }

        /* Style Overlay Borders & Effects */
        .style-clean { border: none; }
        .style-magazine { border: 12px solid #ffffff; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1); }
        .style-caption { border-bottom: 48px solid #ffffff; }
        .style-polaroid { padding: 12px 12px 48px 12px; background: #ffffff; }
        .style-vintage { border: 10px solid #fef3c7; filter: sepia(15%); }
        .style-minimal { border: 2px solid rgba(255,255,255,0.4); }

        .tab-btn.active {
            background-color: #1e293b;
            color: #60a5fa;
            border-bottom: 2px solid #3b82f6;
        }
    </style>
</head>
<body class="h-screen h-[100dvh] flex flex-col overflow-hidden bg-slate-950 text-slate-100 font-sans">

    <!-- Application JavaScript Engine -->
    <script>
        /* Global State */
        const state = {
            images: [], // Array of { id, src, x: 0, y: 0, scale: 1 }
            aspectRatio: '1:1',
            gap: 6,
            padding: 6,
            radius: 4,
            bgColor: '#ffffff',
            frameStyle: 'style-clean',
            activeFilter: 'none',
            selectedLayoutIdx: 0,
            currentLayouts: [],
            draggedImageIdx: null
        };

        const aspectRatios = {
            '1:1': { w: 1, h: 1 },
            '4:5': { w: 4, h: 5 },
            '9:16': { w: 9, h: 16 },
            '16:9': { w: 16, h: 9 },
            '4:3': { w: 4, h: 3 },
            '3:2': { w: 3, h: 2 }
        };

        const filterList = [
            { id: 'none', name: 'オリジナル', class: '' },
            { id: 'mono', name: 'モノクロ', class: 'filter-mono' },
            { id: 'sepia', name: 'セピア', class: 'filter-sepia' },
            { id: 'vintage', name: 'ヴィンテージ', class: 'filter-vintage' },
            { id: 'cyberpunk', name: 'サイバーパンク', class: 'filter-cyberpunk' },
            { id: 'emerald', name: 'エメラルド', class: 'filter-emerald' },
            { id: 'duotone', name: 'デュオトーン', class: 'filter-duotone' },
            { id: 'warm', name: 'ウォーム', class: 'filter-warm' },
            { id: 'cool', name: 'クール', class: 'filter-cool' },
            { id: 'contrast', name: 'ハイコントラスト', class: 'filter-contrast' },
            { id: 'dramatic', name: 'ドラマチック', class: 'filter-dramatic' },
            { id: 'film', name: 'フィルム', class: 'filter-film' },
            { id: 'pastel', name: 'パステル', class: 'filter-pastel' },
            { id: 'vivid', name: 'ビビッド', class: 'filter-vivid' },
            { id: 'noir', name: 'ノワール', class: 'filter-noir' },
            { id: 'fade', name: 'フェード', class: 'filter-fade' },
            { id: 'sunset', name: 'サンセット', class: 'filter-sunset' },
            { id: 'cyber', name: 'サイバー', class: 'filter-cyber' },
            { id: 'rose', name: 'ローズ', class: 'filter-rose' },
            { id: 'soft', name: 'ソフト', class: 'filter-soft' }
        ];

        /* DOM Elements */
        const fileInput = document.getElementById('file-input');
        const uploadDropzone = document.getElementById('upload-dropzone');
        const triggerUpload = document.getElementById('trigger-upload');
        const imageThumbList = document.getElementById('image-thumb-list');
        const imgCount = document.getElementById('img-count');
        const emptyState = document.getElementById('empty-state');
        const collageCanvas = document.getElementById('collage-canvas');
        const collageGrid = document.getElementById('collage-grid');
        const layoutGrid = document.getElementById('layout-grid');
        const filterGrid = document.getElementById('filter-grid');
        const clearAllBtn = document.getElementById('clear-all-images');
        const exportBtn = document.getElementById('export-btn');
        const resetBtn = document.getElementById('reset-btn');

        /* Sliders & Inputs */
        const gapSlider = document.getElementById('gap-slider');
        const paddingSlider = document.getElementById('padding-slider');
        const radiusSlider = document.getElementById('radius-slider');
        const customBgColor = document.getElementById('custom-bg-color');

        /**
         * STREAMING_CHUNK:Building 20 unique standard collage layouts for photo count N...
         * Generate EXACTLY 20 DISTINCT, UNIQUE layout patterns for N images (2 to 10).
         * Standard and equal-spaced grid layouts with 100% exact mathematical column/row dimensions.
         */
        function generate20UniqueLayouts(count) {
            const layouts = [];

            function addLayout(name, cols, rows, slotDefs) {
                layouts.push({ name, cols, rows, slots: slotDefs });
            }

            // Exact Vertical Stripes (1 x count) - 100% equal width
            function makeVerticalStripes(name) {
                const slots = [];
                for (let i = 0; i < count; i++) {
                    slots.push({ colStart: i + 1, colEnd: i + 2, rowStart: 1, rowEnd: 2 });
                }
                return { name, cols: count, rows: 1, slots };
            }

            // Exact Horizontal Stripes (count x 1) - 100% equal height
            function makeHorizontalStripes(name) {
                const slots = [];
                for (let i = 0; i < count; i++) {
                    slots.push({ colStart: 1, colEnd: 2, rowStart: i + 1, rowEnd: i + 2 });
                }
                return { name, cols: 1, rows: count, slots };
            }

            // Exact Top Hero (1 Big Top, N-1 Equal Bottom)
            function makeTopHero(name) {
                const subCount = count - 1;
                const slots = [{ colStart: 1, colEnd: subCount + 1, rowStart: 1, rowEnd: 2 }];
                for (let i = 0; i < subCount; i++) {
                    slots.push({ colStart: i + 1, colEnd: i + 2, rowStart: 2, rowEnd: 3 });
                }
                return { name, cols: subCount, rows: 2, slots };
            }

            // Exact Bottom Hero (N-1 Equal Top, 1 Big Bottom)
            function makeBottomHero(name) {
                const subCount = count - 1;
                const slots = [];
                for (let i = 0; i < subCount; i++) {
                    slots.push({ colStart: i + 1, colEnd: i + 2, rowStart: 1, rowEnd: 2 });
                }
                slots.unshift({ colStart: 1, colEnd: subCount + 1, rowStart: 2, rowEnd: 3 });
                return { name, cols: subCount, rows: 2, slots };
            }

            // Exact Left Hero (1 Big Left, N-1 Equal Right)
            function makeLeftHero(name) {
                const subCount = count - 1;
                const slots = [{ colStart: 1, colEnd: 2, rowStart: 1, rowEnd: subCount + 1 }];
                for (let i = 0; i < subCount; i++) {
                    slots.push({ colStart: 2, colEnd: 3, rowStart: i + 1, rowEnd: i + 2 });
                }
                return { name, cols: 2, rows: subCount, slots };
            }

            // Exact Right Hero (N-1 Equal Left, 1 Big Right)
            function makeRightHero(name) {
                const subCount = count - 1;
                const slots = [];
                for (let i = 0; i < subCount; i++) {
                    slots.push({ colStart: 1, colEnd: 2, rowStart: i + 1, rowEnd: i + 2 });
                }
                slots.unshift({ colStart: 2, colEnd: 3, rowStart: 1, rowEnd: subCount + 1 });
                return { name, cols: 2, rows: subCount, slots };
            }

            // 1. Primary Equal Grids by Photo Count
            if (count === 2) {
                addLayout('1. 均等2分割 (左右)', 2, 1, [{colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2}]);
                addLayout('2. 均等2分割 (上下)', 1, 2, [{colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:1,colEnd:2,rowStart:2,rowEnd:3}]);
            } else if (count === 3) {
                addLayout('1. 均等3列 (縦スリム)', 3, 1, [{colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2},{colStart:3,colEnd:4,rowStart:1,rowEnd:2}]);
                addLayout('2. 均等3行 (横スリム)', 1, 3, [{colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:1,colEnd:2,rowStart:2,rowEnd:3},{colStart:1,colEnd:2,rowStart:3,rowEnd:4}]);
            } else if (count === 4) {

            } else if (count === 5) {
                addLayout('1. 均等配置 (上3/下2)', 6, 2, [

            } else if (count === 6) {
                addLayout('1. 均等3×2 グリッド', 3, 2, [

                addLayout('2. 均等2×3 グリッド', 2, 3, [

                ]);
            } else if (count === 8) {
                addLayout('1. 均等4×2 グリッド', 4, 2, [
                    {colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2},{colStart:3,colEnd:4,rowStart:1,rowEnd:2},{colStart:4,colEnd:5,rowStart:1,rowEnd:2},
                    {colStart:1,colEnd:2,rowStart:2,rowEnd:3},{colStart:2,colEnd:3,rowStart:2,rowEnd:3},{colStart:3,colEnd:4,rowStart:2,rowEnd:3},{colStart:4,colEnd:5,rowStart:2,rowEnd:3}
                ]);
                addLayout('2. 均等2×4 グリッド', 2, 4, [
                    {colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2},
                    {colStart:1,colEnd:2,rowStart:2,rowEnd:3},{colStart:2,colEnd:3,rowStart:2,rowEnd:3},
                    {colStart:1,colEnd:2,rowStart:3,rowEnd:4},{colStart:2,colEnd:3,rowStart:3,rowEnd:4},
                    {colStart:1,colEnd:2,rowStart:4,rowEnd:5},{colStart:2,colEnd:3,rowStart:4,rowEnd:5}
                ]);
            } else if (count === 9) {
                addLayout('1. 均等3×3 正方形グリッド', 3, 3, [
                    {colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2},{colStart:3,colEnd:4,rowStart:1,rowEnd:2},
                    {colStart:1,colEnd:2,rowStart:2,rowEnd:3},{colStart:2,colEnd:3,rowStart:2,rowEnd:3},{colStart:3,colEnd:4,rowStart:2,rowEnd:3},
                    {colStart:1,colEnd:2,rowStart:3,rowEnd:4},{colStart:2,colEnd:3,rowStart:3,rowEnd:4},{colStart:3,colEnd:4,rowStart:3,rowEnd:4}
                ]);
            } else if (count === 10) {
                addLayout('1. 均等5×2 グリッド', 5, 2, [
                    {colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2},{colStart:3,colEnd:4,rowStart:1,rowEnd:2},{colStart:4,colEnd:5,rowStart:1,rowEnd:2},{colStart:5,colEnd:6,rowStart:1,rowEnd:2},
                    {colStart:1,colEnd:2,rowStart:2,rowEnd:3},{colStart:2,colEnd:3,rowStart:2,rowEnd:3},{colStart:3,colEnd:4,rowStart:2,rowEnd:3},{colStart:4,colEnd:5,rowStart:2,rowEnd:3},{colStart:5,colEnd:6,rowStart:2,rowEnd:3}
                ]);
                addLayout('2. 均等2×5 グリッド', 2, 5, [
                    {colStart:1,colEnd:2,rowStart:1,rowEnd:2},{colStart:2,colEnd:3,rowStart:1,rowEnd:2},
                    {colStart:1,colEnd:2,rowStart:2,rowEnd:3},{colStart:2,colEnd:3,rowStart:2,rowEnd:3},
                    {colStart:1,colEnd:2,rowStart:3,rowEnd:4},{colStart:2,colEnd:3,rowStart:3,rowEnd:4},
                    {colStart:1,colEnd:2,rowStart:4,rowEnd:5},{colStart:2,colEnd:3,rowStart:4,rowEnd:5},
                    {colStart:1,colEnd:2,rowStart:5,rowEnd:6},{colStart:2,colEnd:3,rowStart:5,rowEnd:6}
                ]);
            }

            // Always include exact equal Vertical & Horizontal slim line layouts
            layouts.push(makeVerticalStripes(`${layouts.length + 1}. 縦スリムライン (${count}等分)`));
            layouts.push(makeHorizontalStripes(`${layouts.length + 1}. 横スリムライン (${count}等分)`));

            // Hero and Editorial Variations
            layouts.push(makeLeftHero(`${layouts.length + 1}. 左ヒーローメイン`));
            layouts.push(makeRightHero(`${layouts.length + 1}. 右ヒーローメイン`));
            layouts.push(makeTopHero(`${layouts.length + 1}. 上ヒーローメイン`));
            layouts.push(makeBottomHero(`${layouts.length + 1}. 下ヒーローメイン`));

            // Additional 2-column or 3-column split layouts
            if (count >= 3) {
                // Top Hero + Bottom Grid
                const subCount = count - 1;
                const gridCols = Math.ceil(Math.sqrt(subCount));
                const gridRows = Math.ceil(subCount / gridCols);
                const heroSlots = [{ colStart: 1, colEnd: gridCols + 1, rowStart: 1, rowEnd: 2 }];
                let currSlot = 0;
                for (let r = 0; r < gridRows; r++) {
                    for (let c = 0; c < gridCols; c++) {
                        if (currSlot < subCount) {
                            heroSlots.push({ colStart: c + 1, colEnd: c + 2, rowStart: r + 2, rowEnd: r + 3 });
                            currSlot++;
                        }
                    }
                }
                layouts.push({ name: `${layouts.length + 1}. トップヒーロー＋マルチグリッド`, cols: gridCols, rows: gridRows + 1, slots: heroSlots });
            }

            // Fill up to 20 unique layouts cleanly
            while (layouts.length < 20) {
                const idx = layouts.length + 1;
                if (idx % 4 === 0) {
                    layouts.push(makeLeftHero(`${idx}. 左サイドバー非対称`));
                } else if (idx % 4 === 1) {
                    layouts.push(makeTopHero(`${idx}. ヘッダーバナー構図`));
                } else if (idx % 4 === 2) {
                    layouts.push(makeRightHero(`${idx}. 右サイドバー非対称`));
                } else {
                    layouts.push(makeBottomHero(`${idx}. フッターバナー構図`));
                }
            }

            return layouts.slice(0, 20);
        }

        /** STREAMING_CHUNK:Rendering layout preview thumbnails... */
        function renderLayoutThumbnails() {

            if (state.images.length < 2) {

        /** STREAMING_CHUNK:Rendering Collage Canvas Viewport... */
        function renderCollage() {
            if (state.images.length < 2) {
                emptyState.classList.remove('hidden');
                collageGrid.innerHTML = '';
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            const currentLayout = state.currentLayouts[state.selectedLayoutIdx] || state.currentLayouts[0];
            if (!currentLayout) return;

            // Fit Canvas strictly inside viewport bounds
            const viewport = document.getElementById('collage-viewport');
            if (viewport) {
                const ratio = aspectRatios[state.aspectRatio] || { w: 1, h: 1 };
                const maxW = Math.max(viewport.clientWidth - 24, 120);
                const maxH = Math.max(viewport.clientHeight - 24, 120);
                const targetRatio = ratio.w / ratio.h;

                let cW, cH;
                if (maxW / maxH > targetRatio) {
                    cH = maxH;
                    cW = maxH * targetRatio;
                } else {
                    cW = maxW;
                    cH = maxW / targetRatio;
                }

                collageCanvas.style.width = `${Math.round(cW)}px`;
                collageCanvas.style.height = `${Math.round(cH)}px`;
                collageCanvas.style.backgroundColor = state.bgColor;
                collageCanvas.className = state.frameStyle;
            }

            // Set Grid Properties
            collageGrid.style.top = `${state.padding}px`;
            collageGrid.style.left = `${state.padding}px`;
            collageGrid.style.width = `calc(100% - ${state.padding * 2}px)`;
            collageGrid.style.height = `calc(100% - ${state.padding * 2}px)`;
            collageGrid.style.gap = `${state.gap}px`;
            collageGrid.style.gridTemplateColumns = `repeat(${currentLayout.cols}, minmax(0, 1fr))`;
            collageGrid.style.gridTemplateRows = `repeat(${currentLayout.rows}, minmax(0, 1fr))`;

            collageGrid.innerHTML = '';

            const activeFilterObj = filterList.find(f => f.id === state.activeFilter);
            const filterClass = activeFilterObj ? activeFilterObj.class : '';

            currentLayout.slots.forEach((slotDef, idx) => {
                const imgData = state.images[idx];
                if (!imgData) return;

                const slot = document.createElement('div');
                slot.className = `collage-slot ${filterClass}`;
                slot.style.gridColumn = `${slotDef.colStart} / ${slotDef.colEnd}`;
                slot.style.gridRow = `${slotDef.rowStart} / ${slotDef.rowEnd}`;
                slot.style.borderRadius = `${state.radius}px`;
                slot.dataset.index = idx;

                const img = document.createElement('img');
                img.src = imgData.src;
                img.style.transform = `translate(${imgData.x}px, ${imgData.y}px) scale(${imgData.scale})`;

                slot.appendChild(img);

                // Slot Interaction Setup (Pan, Zoom, Double-Tap Reset, Long Press Swap)
                setupSlotInteractions(slot, idx);

                collageGrid.appendChild(slot);
            });
        }

        /** STREAMING_CHUNK:Setting up slot interactions (Pan, Zoom, Double Tap Reset, Long Press Swap)... */
        function setupSlotInteractions(slot, idx) {
            let isPanning = false;
            let startX = 0, startY = 0;
            let initialX = 0, initialY = 0;
            let lastTapTime = 0;
            let longPressTimer = null;

            const imgData = state.images[idx];

            // Double click / Double tap to reset position
            slot.addEventListener('dblclick', (e) => {
                e.preventDefault();
                imgData.x = 0;
                imgData.y = 0;
                imgData.scale = 1;
                renderCollage();
            });

            // Wheel zoom
            slot.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                imgData.scale = Math.min(Math.max(1, imgData.scale + delta), 3);
                renderCollage();
            }, { passive: false });

            // Pointer down
            slot.addEventListener('pointerdown', (e) => {
                isPanning = true;
                startX = e.clientX;
                startY = e.clientY;
                initialX = imgData.x;
                initialY = imgData.y;
                slot.setPointerCapture(e.pointerId);

                // Double tap detection for touch
                const currentTime = new Date().getTime();
                const tapLength = currentTime - lastTapTime;
                if (tapLength < 300 && tapLength > 0) {
                    imgData.x = 0;
                    imgData.y = 0;
                    imgData.scale = 1;
                    renderCollage();
                    return;
                }
                lastTapTime = currentTime;

                // Long press timer for swap
                longPressTimer = setTimeout(() => {
                    isPanning = false;
                    state.draggedImageIdx = idx;
                    slot.classList.add('dragging-active');
                }, 500);
            });

            // Pointer move
            slot.addEventListener('pointermove', (e) => {
                if (!isPanning) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    clearTimeout(longPressTimer);
                }

                imgData.x = initialX + dx;
                imgData.y = initialY + dy;
                
                const img = slot.querySelector('img');
                if (img) {
                    img.style.transform = `translate(${imgData.x}px, ${imgData.y}px) scale(${imgData.scale})`;
                }
            });

            // Pointer up
            slot.addEventListener('pointerup', (e) => {
                clearTimeout(longPressTimer);
                isPanning = false;

                if (state.draggedImageIdx !== null && state.draggedImageIdx !== idx) {
                    // Swap images
                    const temp = state.images[state.draggedImageIdx];
                    state.images[state.draggedImageIdx] = state.images[idx];
                    state.images[idx] = temp;
                    state.draggedImageIdx = null;
                    renderCollage();
                } else {
                    state.draggedImageIdx = null;
                    slot.classList.remove('dragging-active');
                }
            });
        }

        /** STREAMING_CHUNK:Setting up Tab Switching and File Handlers... */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));

                document.getElementById(`tab-${targetTab}`).classList.remove('hidden');

        uploadDropzone.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const files = Array.from(e.target.files);
            handleFiles(files);
        };

        uploadDropzone.ondragover = (e) => {
            e.preventDefault();
            uploadDropzone.classList.add('border-blue-500');
        };

        uploadDropzone.ondragleave = () => {
            uploadDropzone.classList.remove('border-blue-500');
        };

        uploadDropzone.ondrop = (e) => {
            e.preventDefault();
            uploadDropzone.classList.remove('border-blue-500');
            const files = Array.from(e.dataTransfer.files);
            handleFiles(files);
        };

        function handleFiles(files) {
            const validFiles = files.filter(f => f.type.startsWith('image/')).slice(0, 10 - state.images.length);
            
            validFiles.forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    if (state.images.length < 10) {
                        state.images.push({
                            id: Date.now() + Math.random(),
                            src: event.target.result,
                            x: 0,
                            y: 0,
                            scale: 1
                        });
                        updateImageList();
                        renderLayoutThumbnails();
                        renderCollage();
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function updateImageList() {
            imgCount.innerText = state.images.length;
            imageThumbList.innerHTML = '';

            state.images.forEach((imgObj, idx) => {
                const thumb = document.createElement('div');
                thumb.className = 'relative aspect-square rounded-xl overflow-hidden border border-slate-800 group bg-slate-900';
                
                const img = document.createElement('img');
                img.src = imgObj.src;

                delBtn.innerHTML = '<i class="fa-solid fa-xmark"></i>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    state.images.splice(idx, 1);
                    updateImageList();
                    renderLayoutThumbnails();
                    renderCollage();

                thumb.appendChild(img);
                thumb.appendChild(delBtn);
                imageThumbList.appendChild(thumb);
            });
        }

        document.querySelectorAll('.ratio-btn').forEach(btn => {
            btn.onclick = () => {

            btn.onclick = () => {
                document.querySelectorAll('.style-btn').forEach(b => {

                });
                btn.className = 'style-btn px-2 py-1.5 text-xs rounded-xl border border-blue-500 bg-blue-600/20 text-blue-400';
                state.frameStyle = btn.dataset.style;
                renderCollage();
            };
        });

        function initFilterGrid() {
            filterGrid.innerHTML = '';
            filterList.forEach(f => {
                const btn = document.createElement('button');
                btn.className = `p-2 rounded-xl text-left border transition text-xs font-medium ${
                    state.activeFilter === f.id ? 'border-blue-500 bg-blue-600/20 text-blue-400' : 'border-slate-800 bg-slate-900 text-slate-300 hover:bg-slate-800'
                }`;
                btn.innerText = f.name;
                btn.onclick = () => {
                    state.activeFilter = f.id;
                    initFilterGrid();
                    renderCollage();
                };
                filterGrid.appendChild(btn);
            });
        }

        /** STREAMING_CHUNK:High Precision Native 2D Canvas Exporter... */
        exportBtn.onclick = () => {
            if (state.images.length < 2) return;

            const ratio = aspectRatios[state.aspectRatio] || { w: 1, h: 1 };
            const baseSize = 2400; // High res base size
            const canvasW = baseSize;
            const canvasH = Math.round(baseSize * (ratio.h / ratio.w));

            const exportCanvas = document.createElement('canvas');
            exportCanvas.width = canvasW;
            exportCanvas.height = canvasH;
            const ctx = exportCanvas.getContext('2d');

            // Draw Background
            ctx.fillStyle = state.bgColor;
            ctx.fillRect(0, 0, canvasW, canvasH);

            const layout = state.currentLayouts[state.selectedLayoutIdx] || state.currentLayouts[0];
            const currentDOMCanvas = collageCanvas.getBoundingClientRect();
            const scaleFactor = canvasW / currentDOMCanvas.width;

            const padPx = state.padding * scaleFactor;
            const gapPx = state.gap * scaleFactor;
            const radiusPx = state.radius * scaleFactor;

            const gridW = canvasW - (padPx * 2);
            const gridH = canvasH - (padPx * 2);

            const colUnit = (gridW - (gapPx * (layout.cols - 1))) / layout.cols;
            const rowUnit = (gridH - (gapPx * (layout.rows - 1))) / layout.rows;

            let loadedCount = 0;

            layout.slots.forEach((s, idx) => {
                const imgData = state.images[idx];
                if (!imgData) return;

                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    const slotX = padPx + (s.colStart - 1) * (colUnit + gapPx);
                    const slotY = padPx + (s.rowStart - 1) * (rowUnit + gapPx);
                    const slotW = (s.colEnd - s.colStart) * colUnit + (s.colEnd - s.colStart - 1) * gapPx;
                    const slotH = (s.rowEnd - s.rowStart) * rowUnit + (s.rowEnd - s.rowStart - 1) * gapPx;

                    ctx.save();

                    ctx.beginPath();
                    if (radiusPx > 0 && ctx.roundRect) {
                        ctx.roundRect(slotX, slotY, slotW, slotH, radiusPx);
                    } else {
                        ctx.rect(slotX, slotY, slotW, slotH);
                    }
                    ctx.clip();

                    const activeFilterObj = filterList.find(f => f.id === state.activeFilter);
                    if (activeFilterObj && activeFilterObj.id !== 'none') {
                        if (activeFilterObj.id === 'mono') ctx.filter = 'grayscale(100%)';
                        else if (activeFilterObj.id === 'sepia') ctx.filter = 'sepia(90%) contrast(110%)';
                        else if (activeFilterObj.id === 'vintage') ctx.filter = 'sepia(40%) contrast(120%)';
                        else if (activeFilterObj.id === 'cyberpunk') ctx.filter = 'hue-rotate(280deg) saturate(200%)';
                        else if (activeFilterObj.id === 'emerald') ctx.filter = 'hue-rotate(110deg) saturate(140%)';
                        else if (activeFilterObj.id === 'warm') ctx.filter = 'sepia(30%) saturate(140%)';
                        else if (activeFilterObj.id === 'cool') ctx.filter = 'hue-rotate(180deg) saturate(120%)';
                        else if (activeFilterObj.id === 'vivid') ctx.filter = 'saturate(220%) contrast(115%)';
                        else if (activeFilterObj.id === 'noir') ctx.filter = 'grayscale(100%) contrast(200%)';
                    }

                    const imgAspect = img.width / img.height;
                    const slotAspect = slotW / slotH;
                    let renderW, renderH;

                    if (imgAspect > slotAspect) {
                        renderH = slotH;
                        renderW = slotH * imgAspect;
                    } else {
                        renderW = slotW;
                        renderH = slotW / imgAspect;
                    }

                    const panX = imgData.x * scaleFactor;
                    const panY = imgData.y * scaleFactor;
                    const zoom = imgData.scale;

                    const drawW = renderW * zoom;
                    const drawH = renderH * zoom;
                    const drawX = slotX + (slotW - drawW) / 2 + panX;
                    const drawY = slotY + (slotH - drawH) / 2 + panY;

                    ctx.drawImage(img, drawX, drawY, drawW, drawH);
                    ctx.restore();

                    loadedCount++;
                    if (loadedCount === layout.slots.length) {
                        const link = document.createElement('a');
                        link.download = `collage-${Date.now()}.png`;
                        link.href = exportCanvas.toDataURL('image/png');
                        link.click();
                    }
                };
                img.src = imgData.src;
            });
        };

        resetBtn.onclick = () => {
            state.images = [];
            state.selectedLayoutIdx = 0;
            state.activeFilter = 'none';
            state.gap = 6;
            state.padding = 6;
            state.radius = 4;
            gapSlider.value = 6;
            paddingSlider.value = 6;
            radiusSlider.value = 4;
            updateImageList();
            renderLayoutThumbnails();
            renderCollage();
        };

        window.onload = () => {
            initFilterGrid();
            renderCollage();
            window.addEventListener('resize', renderCollage);
        };
    </script>
</body>
</html>
